<!DOCTYPE html>
<html>
<head>
    <title>Pseudo Class</title>

    <style>
        button {
            background-color: black;
            color: white;
            padding: 10px 20px;
        }

        button:hover {
            background-color: green;
        }

        button:active {
            background-color: red;
        }

        input:focus {
            border: 3px solid blue;
        }
    </style>
</head>

<body>

    <h2>CSS Pseudo Classes</h2>

    <button>Click Me</button>

    <br><br>

    <input type="text" placeholder="Enter your name">

</body>
</html>
