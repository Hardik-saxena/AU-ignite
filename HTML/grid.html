<!DOCTYPE html>
<html>
<head>
    <title>Grid Layout</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px;
        }

        .grid-container {
            width: 900px;
            height: 600px;
            border: 3px solid black;

            display: grid;
            grid-template-columns: 22% 78%;
            grid-template-rows: 80px 1fr;
        }

        /* Top */
        .top {
            grid-column: 1 / 3;
            border-bottom: 2px solid black;

            display: flex;
            justify-content: center;
            align-items: center;
            background-color: aqua;
        }

        /* Left */
        .left {
            border-right: 2px solid black;

            display: flex;
            justify-content: center;
            align-items: center;
            background-color: blueviolet;
        }

        /* Right */
        .right {
            display: grid;
            grid-template-rows: 1fr 1fr 1fr;
            background-color: blue;
        }

        /* Right Top */
        .right-top {
            border-bottom: 2px solid black;

            display: flex;
            justify-content: center;
            align-items: center;
            background-color: brown;
        }

        /* Middle */
        .right-middle {
            display: grid;
            grid-template-columns: 1fr 1fr;
            border-bottom: 2px solid black;
        }

        .right-middle div {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .right-middle div:first-child {
            border-right: 2px solid black;
        }

        /* Bottom */
        .right-bottom {
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>

<body>

    <div class="grid-container">

        <div class="top">
            
        </div>

        <div class="left">
            
        </div>

        <div class="right">

            <div class="right-top">
                
            </div>

            <div class="right-middle">
                <div></div>
                <div></div>
            </div>

            <div class="right-bottom">
                
            </div>

        </div>

    </div>

</body>
</html>
